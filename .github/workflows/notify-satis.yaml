# Reusable Workflow — wird von den Paket-Repos über das Workflow-Template
# workflow-templates/notify-satis.yml in ideenstadtwerke/.github aufgerufen.
name: Notify Satis

on:
  workflow_call:
    inputs:
      # Nur zur Nachvollziehbarkeit (run-name in deploy.yaml). Der Rebuild lädt bewusst
      # alle Repos aus satis.json neu, nicht nur dieses: Der Output wird jedes Mal frisch
      # ins Image gebacken, ein Teil-Build würde alle anderen Pakete verlieren.
      package-repo:
        description: Paket-Repo, das den Rebuild auslöst (owner/name)
        required: true
        type: string
    secrets:
      dispatch-token:
        description: PAT mit Schreibzugriff auf ideenstadtwerke/Pattr.Packages
        required: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    # Der Dispatch läuft über den PAT, das GITHUB_TOKEN wird nicht gebraucht.
    permissions: {}
    steps:
      - name: Trigger Satis rebuild
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.dispatch-token }}
          repository: ideenstadtwerke/Pattr.Packages
          event-type: satis-rebuild
          client-payload: '{"repo": "${{ inputs.package-repo }}"}'
